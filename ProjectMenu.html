<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROJECTS · GAME SELECT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Days+One&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<link rel="stylesheet" href="Css/GameCubeProjects.css">

</head>
<body x-data="discs()" @keydown.arrow-left.window.prevent="move(-1)" @keydown.arrow-right.window.prevent="move(1)"
      @keydown.enter.window="if(!['BUTTON','A'].includes(document.activeElement.tagName)) launch(current)">
<noscript><div style="max-width:30rem;margin:20vh auto;text-align:center;font-weight:700;color:#8f8ac2">This disc loader needs JavaScript. Please enable it.</div></noscript>

<!-- ambient background: your original dotgrid + drifting shapes + vignette -->
<div class="bgfx" aria-hidden="true">
  <div class="dotgrid"></div>
  <div class="shape" style="width:190px;height:190px;top:12%;left:7%;animation-duration:27s"></div>
  <div class="shape gold" style="width:120px;height:120px;top:64%;left:14%;animation-duration:21s;animation-delay:-6s"></div>
  <div class="shape" style="width:150px;height:150px;top:22%;right:9%;animation-duration:31s;animation-delay:-11s"></div>
  <div class="shape gold" style="width:90px;height:90px;top:74%;right:18%;animation-duration:19s;animation-delay:-3s"></div>
  <div class="shape" style="width:70px;height:70px;top:44%;left:44%;animation-duration:24s;animation-delay:-14s"></div>
  <div class="shape" style="width:240px;height:240px;top:-60px;left:52%;animation-duration:36s;animation-delay:-8s"></div>
  <div class="vignette"></div>
</div>

<div class="page" x-cloak>
  <header>
    <div class="brand">
      <svg class="logo a-float" viewBox="0 0 48 48" fill="none" stroke="#ffd21e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M24 5.5 40 14v20L24 42.5 8 34V14Z"/><path d="M8 14l16 8.5L40 14"/><path d="M24 22.5V42.5"/>
      </svg>
      <div>
        <h1>PROJECTS</h1>
        <p>GAME SELECT · PLAYER 1</p>
      </div>
    </div>
    <nav class="hnav" aria-label="Site">
      <a class="tab tab-off" href="index.html">HOME</a>
      <span class="tab tab-on" aria-current="page">PROJECTS</span>
      <a class="tab tab-off" href="about.html">ABOUT</a>
    </nav>
  </header>

  <main class="stage">
    <!-- ============ disc loader ============ -->
    <section class="discside">
      <div class="kicker">
        <h2>GAME SELECT</h2>
        <p x-text="'SLOT-TOP LOADER · ' + items.length + ' DISCS'"></p>
      </div>

      <!-- the disc in the slot — click to launch -->
      <button type="button" class="tray" @click="launch(current)" :aria-label="'Play ' + current.title">
        <template x-for="c in [current]" :key="sel">
          <span class="discwrap" x-html="c.disc"></span>
        </template>
      </button>

      <template x-for="c in [current]" :key="sel">
        <div class="swap" style="width:100%">
          <h3 class="gtitle" x-text="c.title"></h3>
          <p class="gsub" x-text="c.tag"></p>
          <p class="pub" x-text="'\u00A9 ' + c.year + ' PLAYER ONE SOFT \u00B7 ' + c.serial"></p>
        </div>
      </template>

      <div class="startrow">
        <a class="dbtn dbtn-primary" :href="current.live" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.6" fill="#8f97a6"/><circle cx="10" cy="10" r="5.9" fill="#6fce53"/><text x="10" y="13.6" text-anchor="middle" font-family="Quicksand,sans-serif" font-size="9" font-weight="800" fill="#1d3a14">A</text></svg>
          GAME PLAY
        </a>
      </div>

      <!-- the shelf of other discs -->
      <div class="shelf" x-ref="shelf" aria-label="Other projects" @mouseleave="ringBack()">
        <template x-for="item in items" :key="item.id">
          <button type="button" class="sdisc" :class="{sel: sel === item.id}" :data-id="item.id"
                  @click="activate(item.id)" @mouseenter="setSel(item.id); ringTo($el)" @focus="setSel(item.id); ringTo($el)">
            <span x-html="item.mini"></span>
            <span class="sname" x-text="item.short"></span>
          </button>
        </template>
        <div class="cursor-ring" :style="ringStyle" aria-hidden="true"></div>
      </div>
      <p class="hint">HOVER TO PREVIEW · CLICK A DISC OR GAME PLAY TO LAUNCH · &#8592;/&#8594; TO BROWSE</p>
    </section>

    <!-- ============ back-of-the-box panel ============ -->
    <aside class="panel" aria-live="polite">
      <div class="phead">
        <div class="picon" x-html="current.mini"></div>
        <div>
          <div class="pname" x-text="current.title"></div>
          <div class="ptitle" x-text="current.tag"></div>
        </div>
      </div>
      <div class="pmeta" x-html="current.chips"></div>
      <div class="pdiv"></div>

      <div class="pbody">
        <template x-for="c in [current]" :key="sel">
          <div class="swap" x-html="c.body"></div>
        </template>
      </div>
    </aside>
  </main>
</div>

<!-- BIOS bottom bar -->
<footer class="biosbar" x-cloak>
  <span class="led a-dash"></span>
  <span x-text="'GAME SELECT · ' + items.length + ' DISCS'"></span>
  <span class="sep s1"></span>
  <span class="date" x-text="dateStr"></span>
  <span class="sep"></span>
  <span class="clock" x-text="clock"></span>
</footer>

<script>
/* ================================================================
   ✏️  EDIT YOUR PROJECTS HERE — each entry is one game disc.
   accent = disc label color · anim = idle BIOS animation
   ================================================================ */
const PROJECTS = [
  {
    id:'nebula', title:'NEBULA DASH', short:'NEBULA', tag:'ENDLESS RUNNER · WEBGAME',
    year:'2024', status:'SHIPPED', role:'SOLO DEV', serial:'DOL-P-NBD',
    accent:'#7d71e0', anim:'a-float',
    icon:'<path d="M24 6c5.5 4.8 7.5 11 7.5 17L24 28.5 16.5 23c0-6 2-12.2 7.5-17Z"/><circle cx="24" cy="17" r="3.4"/><path d="M16.5 24.5 11 32l6.8-2M31.5 24.5 37 32l-6.8-2"/><path d="M24 31v6"/>',
    stack:['CANVAS','TYPESCRIPT','VITE'],
    desc:['A one-button space runner that runs at 60fps on a potato. Procedural asteroid fields, local leaderboards, and a synth soundtrack generated in the browser.',
          'Built in six weeks for a game-jam; stayed online ever since because people kept sending me their high scores.'],
    live:'https://example.com/nebula', source:'https://github.com/your-handle/nebula-dash'
  },
  {
    id:'forge', title:'PIXEL FORGE', short:'FORGE', tag:'SPRITE EDITOR · TOOL',
    year:'2023', status:'SHIPPED', role:'SOLO DEV', serial:'DOL-P-PXF',
    accent:'#ffd21e', anim:'a-punch',
    icon:'<path d="M10 38 25 23"/><path d="M31 9v10M26 14h10"/><path d="M35 26.5v6M32 29.5h6"/><path d="M14 12v6M11 15h6"/>',
    stack:['VANILLA JS','CANVAS','PWA'],
    desc:['A tiny pixel-art studio in the browser: layers, onion skinning, palettes, and export straight to sprite sheets. No install, no account, no nonsense.',
          'Made because I needed it for my own games and refused to pay for a subscription to draw 16×16 squares.'],
    live:'https://example.com/forge', source:'https://github.com/your-handle/pixel-forge'
  },
  {
    id:'waveform', title:'WAVEFORM', short:'WAVE', tag:'AUDIO VISUALIZER · TOY',
    year:'2024', status:'IN DEV', role:'DESIGN + CODE', serial:'DOL-P-WVF',
    accent:'#ff5470', anim:'a-beat',
    icon:'<path d="M11 20v8M16 14v20M21 9v30M26 17v14M31 12v24M36 21v6"/>',
    stack:['WEB AUDIO','SVG','GLSL'],
    desc:['Drop in any track and watch it explode into particles, rings and oscilloscope lines. Every visual parameter is tweakable in real time.',
          'Currently learning shaders the fun way — by pointing them at music until something beautiful breaks.'],
    live:'https://example.com/waveform', source:'https://github.com/your-handle/waveform'
  },
  {
    id:'terrarium', title:'TERRARIUM', short:'TERRA', tag:'GENERATIVE GARDEN · EXPERIMENT',
    year:'2023', status:'SHIPPED', role:'SOLO DEV', serial:'DOL-P-TRR',
    accent:'#6ee791', anim:'a-sway',
    icon:'<path d="M13 35C13 21 24 12 36 12c0 12-9 23-23 23Z"/><path d="M16 32c5.5-6 11-11.5 16-16"/><path d="M13 35l-3 4"/>',
    stack:['CANVAS','SEEDS','L-SYSTEMS'],
    desc:['Every visitor gets a unique plant grown from the URL seed. Water it daily and it flourishes; ignore it and it gets dramatic.',
          'A study in making generative art feel alive instead of random. The ferns are my favorite.'],
    live:'https://example.com/terrarium', source:'https://github.com/your-handle/terrarium'
  },
  {
    id:'orbital', title:'ORBITAL', short:'ORBIT', tag:'SOLAR SYSTEM · 3D',
    year:'2022', status:'SHIPPED', role:'SOLO DEV', serial:'DOL-P-ORB',
    accent:'#b9a6f2', anim:'a-orbit',
    icon:'<circle cx="24" cy="24" r="9.5"/><ellipse cx="24" cy="24" rx="16.5" ry="5.2" transform="rotate(-16 24 24)"/><circle cx="38.5" cy="12.5" r="2"/>',
    stack:['THREE.JS','WEBGL','TYPESCRIPT'],
    desc:['A hand-built 3D orrery: real orbital periods, scaled distances, and a time-warp slider that lets you watch a full Jupiter year in seconds.',
          'My first Three.js project — the code is older and wiser than some of my habits.'],
    live:'https://example.com/orbital', source:'https://github.com/your-handle/orbital'
  },
  {
    id:'stargazer', title:'STARGAZER', short:'STAR', tag:'STAR MAP · WEBAPP',
    year:'2022', status:'PROTOTYPE', role:'DESIGN + CODE', serial:'DOL-P-STR',
    accent:'#8f8ac2', anim:'a-rays',
    icon:'<path d="M24 7.5 27.4 20.6 40.5 24 27.4 27.4 24 40.5 20.6 27.4 7.5 24 20.6 20.6Z"/>',
    stack:['D3','GEOGRAPHY','OPEN DATA'],
    desc:['Point your phone at the sky and Stargazer draws the constellations above you, using only open catalog data and a compass.',
          'Prototype stage: the stars are accurate, the UX still occasionally points at the floor.'],
    live:'https://example.com/stargazer', source:'https://github.com/your-handle/stargazer'
  }
];

/* ---------- disc renderers ---------- */
/* Big disc: silver body, label printed on the TOP HALF only — like real GameCube discs */
function bigDisc(p) {
  const gid = 'dg_' + p.id;
  return '<svg class="' + p.anim + '" viewBox="0 0 200 200" aria-hidden="true">'
    + '<defs><radialGradient id="' + gid + '" cx="36%" cy="30%" r="82%">'
    + '<stop offset="0" stop-color="#f4f2fc"/><stop offset=".45" stop-color="#d3cdee"/>'
    + '<stop offset=".78" stop-color="#aaa1d3"/><stop offset="1" stop-color="#8078ad"/></radialGradient></defs>'
    + '<circle cx="100" cy="100" r="97" fill="url(#' + gid + ')"/>'
    + '<circle cx="100" cy="100" r="97" fill="none" stroke="rgba(13,12,36,.5)" stroke-width="1.5"/>'
    + '<circle cx="100" cy="100" r="60" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.2"/>'
    + '<circle cx="100" cy="100" r="45" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.2"/>'
    /* label — top half annulus */
    + '<path d="M10 100 A90 90 0 0 0 190 100 L136 100 A36 36 0 0 1 64 100 Z" fill="' + p.accent + '"/>'
    + '<g transform="translate(77,16) scale(.95)" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' + p.icon + '</g>'
    /* hub */
    + '<circle cx="100" cy="100" r="30" fill="#e9e5f7" stroke="rgba(13,12,36,.35)" stroke-width="2"/>'
    + '<circle cx="100" cy="100" r="21" fill="#cdc7e8"/>'
    + '<circle cx="100" cy="100" r="8" fill="#0d0c24"/>'
    + '<circle cx="97.5" cy="97.5" r="2" fill="rgba(255,255,255,.55)"/>'
    /* sheen */
    + '<path d="M30 58 A76 76 0 0 1 74 20" stroke="rgba(255,255,255,.55)" stroke-width="9" fill="none" stroke-linecap="round" opacity=".35"/>'
    + '<path d="M170 148 A74 74 0 0 1 136 180" stroke="rgba(255,255,255,.4)" stroke-width="6" fill="none" stroke-linecap="round" opacity=".22"/>'
    + '</svg>';
}
/* Mini disc for the shelf + panel */
function miniDisc(p) {
  return '<svg class="' + p.anim + '" viewBox="0 0 48 48" aria-hidden="true">'
    + '<circle cx="24" cy="24" r="23" fill="#cbc5e8" stroke="rgba(13,12,36,.4)" stroke-width="1.4"/>'
    + '<path d="M1 24 A23 23 0 0 0 47 24 Z" fill="' + p.accent + '"/>'
    + '<g transform="translate(14,6) scale(.42)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">' + p.icon + '</g>'
    + '<circle cx="24" cy="24" r="7.5" fill="#dcd7ef" stroke="rgba(13,12,36,.3)" stroke-width="1.2"/>'
    + '<circle cx="24" cy="24" r="2.6" fill="#0d0c24"/>'
    + '</svg>';
}
const arrowSvg = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13 13 3M6.5 3H13v6.5"/></svg>';
const stChip = s => s === 'SHIPPED' ? 'chip chip-rw' : s === 'IN DEV' ? 'chip chip-gold' : 'chip';

const ITEMS = PROJECTS.map(p => ({
  ...p,
  disc: bigDisc(p),
  mini: miniDisc(p),
  chips: '<span class="chip">YEAR · ' + p.year + '</span>'
       + '<span class="' + stChip(p.status) + '">STATUS · ' + p.status + '</span>'
       + '<span class="chip">ROLE · ' + p.role + '</span>',
  body: '<p>' + p.desc[0] + '</p><p class="sub">' + p.desc[1] + '</p>'
      + '<div class="tagrow">' + p.stack.map(s => '<span class="chip">' + s + '</span>').join('') + '</div>'
      + '<a class="linkrow" href="' + p.live + '" target="_blank" rel="noopener">LIVE SITE ' + arrowSvg + '</a>'
      + '<a class="linkrow" href="' + p.source + '" target="_blank" rel="noopener">SOURCE CODE ' + arrowSvg + '</a>'
      + '<p class="footnote">Disc condition: mint. Manual included in the repo.</p>'
}));

/* ---------- console state ---------- */
function discs() {
  return {
    items: ITEMS,
    sel: ITEMS[0].id,
    ring: { x: 0, y: 0, w: 0, h: 0, visible: false },
    clock: '', dateStr: '', ac: null,

    get current() { return this.items.find(i => i.id === this.sel) || this.items[0]; },
    get ringStyle() {
      const r = this.ring;
      return 'transform:translate(' + r.x + 'px,' + r.y + 'px);width:' + r.w + 'px;height:' + r.h + 'px;opacity:' + (r.visible ? 1 : 0);
    },

    init() {
      this.tick();
      setInterval(() => this.tick(), 1000);
      this.$nextTick(() => this.ringBack());
      window.addEventListener('resize', () => { if (this.ring.visible) this.ringBack(); });
    },

    tick() {
      const d = new Date();
      this.clock = d.toLocaleTimeString('en-GB', { hour12: false });
      this.dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit' }).toUpperCase().replace(/,/g, '');
    },

    setSel(id) { if (this.sel !== id) this.sel = id; },
    activate(id) { this.setSel(id); this.blip(940, .06); },
    move(d) {
      const i = this.items.findIndex(x => x.id === this.sel);
      this.setSel(this.items[(i + d + this.items.length) % this.items.length].id);
      this.$nextTick(() => this.ringBack());
      this.blip(700, .045);
    },

    /* launch the disc — little startup jingle, then open */
    launch(p) {
      this.blip(1040, .08);
      setTimeout(() => this.blip(784, .08), 110);
      setTimeout(() => window.open(p.live, '_blank', 'noopener'), 160);
    },

    /* yellow ring snap */
    ringTo(el) {
      if (!el || !this.$refs.shelf) return;
      const s = this.$refs.shelf.getBoundingClientRect(), r = el.getBoundingClientRect();
      this.ring = { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height, visible: true };
    },
    ringBack() {
      const el = this.$refs.shelf && this.$refs.shelf.querySelector('.sdisc[data-id="' + this.sel + '"]');
      if (el) this.ringTo(el);
    },

    /* menu blip — synthesized, no files */
    blip(freq = 880, dur = .07) {
      try {
        this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = 'square'; o.frequency.value = freq;
        g.gain.setValueAtTime(.035, this.ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.0001, this.ac.currentTime + dur);
        let node = o.connect(g);
        if (this.ac.createStereoPanner) {
          const pan = this.ac.createStereoPanner();
          pan.pan.value = .4;
          node = node.connect(pan);
        }
        node.connect(this.ac.destination);
        o.start(); o.stop(this.ac.currentTime + dur);
      } catch (e) {}
    }
  };
}
</script>
</body>
</html>
