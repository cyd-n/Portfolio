<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07051a">
<title>Quidon Roethof, Software Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        void: '#07051a', deep: '#130d40', royal: '#2b2080', lav: '#c6bdff', ink: '#f3f0ff', dim: '#aaa3da', mute: '#716aa8',
        gold: '#ffb547', gold2: '#ffd896', padA: '#34d399', padB: '#fb6376',
        panel: 'rgba(19,13,60,.64)', panel2: 'rgba(44,33,120,.42)', line: 'rgba(198,189,255,.16)', line2: 'rgba(198,189,255,.34)'
      },
      fontFamily: {
        sans: ['"M PLUS Rounded 1c"', 'ui-rounded', '"SF Pro Rounded"', '"Segoe UI"', 'system-ui', 'sans-serif'],
        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
      }
    }
  }
};
</script>
<style type="text/tailwindcss">
@layer components {
  .panel { @apply bg-panel border border-line rounded-[22px] backdrop-blur-md shadow-[0_22px_60px_rgba(0,0,0,.35),inset_0_1px_0_rgba(255,255,255,.05)]; }
  .kb { @apply inline-grid place-items-center min-w-[20px] h-5 px-1.5 rounded-full text-[10px] font-black text-void bg-lav; }
  .chip { @apply text-xs font-bold px-3 py-1 rounded-full border; }
  .navbtn { @apply w-11 h-11 rounded-full border border-line2 bg-void/40 grid place-items-center transition hover:border-gold/60 hover:text-gold; }
  .tile-on { @apply border-gold/60 bg-gold/10 text-gold shadow-[0_0_22px_rgba(255,181,71,.2)]; }
}
</style>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#07051a;--ink:#f3f0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07051a;--ink:#f3f0ff}}
:root[data-theme="dark"]{--bg:#07051a;--ink:#f3f0ff}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background-color:var(--bg);color:var(--ink)}
[x-cloak]{display:none!important}
:focus-visible{outline:2px solid #ffb547;outline-offset:3px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
.letter{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(16px) scale(1.25);transition:opacity .7s cubic-bezier(.2,.8,.2,1),filter .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*55ms)}
.letter.in{opacity:1;filter:none;transform:none;text-shadow:0 0 28px rgba(150,135,255,.7)}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pts li{position:relative;padding-left:20px;font-size:14px;line-height:1.5;color:#aaa3da}
.pts li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:2px;background:#c6bdff;transform:rotate(45deg);opacity:.7}
.meter{display:grid;grid-template-columns:repeat(59,1fr);gap:2px;max-width:560px}
.meter i{height:11px;border-radius:2px;background:rgba(255,255,255,.08)}
.meter i.on{background:linear-gradient(#ffd896,#ffb547);animation:fill .35s both;animation-delay:calc(var(--k)*9ms)}
@keyframes fill{from{opacity:0;transform:scaleY(.2)}}
@keyframes blink{50%{opacity:.35}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes tumble{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}}
.blink{animation:blink .6s steps(2) infinite}
.blink-slow{animation:blink 1s steps(2) infinite}
.bob{animation:bob .9s ease-in-out infinite}
.tumble{animation:tumble 1s cubic-bezier(.6,0,.4,1) infinite}
.pulse{animation:pulse 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body x-data="app" @keydown.window="onKey($event)" @keyup.window="onKeyUp($event)"
      class="h-full overflow-hidden font-sans text-ink antialiased select-none bg-[radial-gradient(120%_90%_at_50%_40%,#2b2080_0%,#130d40_45%,#07051a_100%)]">
<div id="app" class="relative h-full overflow-hidden transition-transform duration-300" :style="`transform:translateX(${pos * 6}px)`">

  <div class="absolute inset-0 pointer-events-none transition-opacity duration-[1400ms] bg-[radial-gradient(circle_at_50%_45%,#0d0930_0%,#030208_72%)]" :class="veil ? 'opacity-100' : 'opacity-0'"></div>
  <canvas id="gl" class="absolute inset-0 block w-full h-full" aria-hidden="true"></canvas>

  <!-- POWER -->
  <section x-show="layer === 'power'" x-transition.opacity.duration.450ms class="absolute inset-0 z-10 grid place-items-center text-center" aria-label="Power on">
    <div class="flex flex-col items-center gap-6">
      <div class="flex items-center gap-2.5 text-xs font-bold tracking-[.3em] text-dim">
        <i class="w-[9px] h-[9px] rounded-full transition" :class="led ? 'bg-padA shadow-[0_0_12px_#34d399]' : 'bg-[#173226]'"></i>POWER
      </div>
      <button @pointerdown="downT = performance.now()" @click="pwrClick()" aria-label="Power on"
              class="grid place-items-center w-[104px] h-[104px] rounded-full border-2 border-line2 text-lav transition bg-[radial-gradient(circle_at_50%_30%,#2e2476,#100b30_75%)] shadow-[0_0_0_10px_rgba(91,79,224,.07),0_14px_40px_rgba(0,0,0,.55)] hover:text-white hover:shadow-[0_0_0_12px_rgba(91,79,224,.16),0_0_60px_rgba(123,111,240,.45)] active:scale-95">
        <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
      </button>
      <p class="m-0 text-sm text-dim">Press to power on</p>
      <p class="m-0 text-sm text-dim">This site is largely AI Generated I only change a few thing so it is all correct, </p>
    <p class="m-0 text-sm text-dim">I am not a FontEnd dev, but some people care about visaulize</p>
      <button @click="skipIntro()" class="p-1.5 text-[13px] underline underline-offset-4 text-mute hover:text-dim">Skip the intro</button>
    </div>
    <p class="absolute inset-x-0 bottom-5 m-0 text-xs text-mute">Best with sound on</p>
  </section>

  <!-- BOOT -->
  <section x-show="layer === 'boot'" x-cloak x-transition.opacity.duration.400ms @pointerdown="skip()" class="absolute inset-0 z-10" aria-label="Intro">
    <div class="absolute inset-x-0 bottom-[14%] text-center">
      <h1 class="m-0 font-black text-[clamp(26px,5.2vw,50px)] tracking-[.3em] pl-[.3em] whitespace-nowrap">
        <template x-for="(ch, i) in nameChars" :key="i"><span class="letter" :class="bootName && 'in'" :style="`--i:${i}`" x-text="ch === ' ' ? '\u00a0' : ch"></span></template>
      </h1>
      <p class="mt-2 mb-0 text-sm text-dim transition-opacity duration-1000 delay-1000" :class="bootName ? 'opacity-100' : 'opacity-0'" x-text="C.role"></p>
    </div>
    <p class="absolute m-0 text-xs bottom-4 right-5 text-mute">Press any key to skip</p>
  </section>

  <!-- MENU -->
  <section x-show="layer === 'menu'" x-cloak x-transition.opacity.duration.400ms class="absolute inset-0 z-10" aria-label="Main menu">
    <div class="absolute top-[22px] left-6">
      <b class="block text-[15px] font-extrabold tracking-[.14em]" x-text="C.name.toUpperCase()"></b>
      <span class="text-[13px] text-dim" x-text="C.role"></span>
    </div>
    <div class="absolute top-6 right-6 font-mono text-sm text-dim" x-text="`${clock.h}:${clock.m}`"></div>
    <template x-for="o in menuOpts" :key="o.dir">
      <button class="absolute top-1/2 left-1/2 flex flex-col items-center gap-2 p-2 rounded-2xl transition-colors"
              :style="optStyle(o.dir)" :class="menuSel === o.dir ? 'text-gold' : 'text-dim'"
              @mouseenter="hoverSel(o.dir)" @click="openFromMenu(o.dir)">
        <span class="grid place-items-center w-[54px] h-[54px] sm:w-[62px] sm:h-[62px] rounded-[18px] border transition duration-300 [&>svg]:w-7 [&>svg]:h-7 sm:[&>svg]:w-8 sm:[&>svg]:h-8"
              :class="menuSel === o.dir ? 'scale-[1.13] bg-gold/10 border-gold/60 shadow-[0_0_26px_rgba(255,181,71,.35)]' : 'bg-panel2 border-line'" x-html="o.icon"></span>
        <span class="text-[11px] sm:text-xs font-extrabold tracking-[.14em] sm:tracking-[.2em] whitespace-nowrap" x-text="o.label"></span>
      </button>
    </template>
    <p class="absolute inset-x-0 bottom-[60px] m-0 text-center text-sm text-dim pointer-events-none [@media(max-height:540px)]:hidden" x-text="menuDesc"></p>
  </section>

  <!-- SHARED SCREEN HEADER -->
  <header x-show="isScreen" x-cloak x-transition.opacity.duration.400ms class="absolute inset-x-0 top-0 z-20 flex items-center gap-3.5 px-[clamp(14px,3vw,36px)] pt-4">
    <button id="backBtn" @click="back()" aria-label="Back to menu" class="relative flex-none w-[54px] h-[54px] rounded-2xl border border-line hover:border-line2">
      <span class="absolute kb bg-padB -right-1.5 -bottom-1.5">B</span>
    </button>
    <div>
      <div class="text-[clamp(19px,2.4vw,25px)] font-black tracking-[.22em]" x-text="meta.title"></div>
      <div class="text-[13px] text-dim mt-0.5" x-text="meta.sub"></div>
    </div>
  </header>

  <!-- PLAY DISC -->
  <section x-show="layer === 'disc'" x-cloak x-transition.opacity.duration.400ms class="absolute inset-0 z-10 flex flex-col pt-[86px] pb-12 px-[clamp(14px,3vw,36px)]" aria-label="Projects">
    <div class="grid flex-1 min-h-0 gap-4 md:gap-6 grid-cols-1 grid-rows-[minmax(260px,44%)_minmax(0,1fr)] md:grid-rows-1 md:grid-cols-[minmax(0,1fr)_minmax(320px,450px)]">
      <div id="discStage" class="relative min-h-[220px] touch-pan-y" @pointerdown="swipeStart($event)" @pointerup="swipeEnd($event)">
        <div class="absolute inset-x-0 top-1.5 text-center font-extrabold tracking-[.2em] text-gold transition-opacity" :class="disc.reading ? 'opacity-100 blink' : 'opacity-0'">READING DISC</div>
        <div class="absolute inset-x-0 bottom-0 flex items-center justify-center gap-4">
          <button class="navbtn" @click="discGo(-1)" aria-label="Previous project"><svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <span class="font-mono text-sm text-center text-dim min-w-[64px]" x-text="`${disc.idx + 1} / ${C.projects.length}`"></span>
          <button class="navbtn" @click="discGo(1)" aria-label="Next project"><svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
      <article class="max-h-full p-5 overflow-auto panel md:p-7 md:self-center" aria-live="polite">
        <div class="flex flex-wrap gap-2 mb-3">
          <span x-show="project.kind" class="chip text-gold bg-gold/10 border-gold/40" x-text="project.kind"></span>
          <span x-show="project.year" class="chip text-dim border-line2" x-text="project.year"></span>
        </div>
        <h2 class="m-0 mb-4 text-[clamp(28px,3.4vw,38px)] font-black leading-[1.05]" x-text="project.title"></h2>
        <dl x-show="projectMeta.length" class="grid grid-cols-2 m-0 mb-5 gap-x-5 gap-y-3">
          <template x-for="m in projectMeta" :key="m[0]"><div><dt class="text-xs text-mute mb-0.5" x-text="m[0]"></dt><dd class="m-0 text-sm font-bold" x-text="m[1]"></dd></div></template>
        </dl>
        <p class="m-0 mb-4 text-[15px] leading-relaxed text-[#dcd7fb] max-w-[60ch]" x-text="project.desc"></p>
        <ul x-show="project.points.length" class="mb-5 pts"><template x-for="x in project.points" :key="x"><li x-text="x"></li></template></ul>
        <div x-show="projectLinks.length" class="flex flex-wrap gap-2.5">
          <template x-for="(l, i) in projectLinks" :key="l[0]">
            <button class="inline-flex items-center gap-2 px-4 py-2.5 rounded-[14px] border text-sm font-extrabold transition"
                    :class="i === 0 ? 'bg-gold text-[#1a1130] border-transparent shadow-[0_0_24px_rgba(255,181,71,.3)] hover:bg-gold2' : 'border-line2 bg-white/5 hover:border-gold/60 hover:text-gold'"
                    @click="i === 0 ? discStart() : openUrl(project.links[l[0]])">
              <span x-show="i === 0" class="kb bg-padA">A</span><span x-text="l[1]"></span>
            </button>
          </template>
        </div>
      </article>
    </div>
  </section>

  <!-- MEMORY CARD -->
  <section x-show="layer === 'memory'" x-cloak x-transition.opacity.duration.400ms class="absolute inset-0 z-10 flex flex-col pt-[86px] pb-12 px-[clamp(14px,3vw,36px)]" aria-label="Skills">
    <div class="relative flex-1 min-h-0 overflow-auto">
      <div x-show="mem.checking" class="absolute inset-0 grid content-center gap-4 justify-items-center text-[15px] text-dim">
        <div class="w-[26px] h-[26px] rounded-md bg-gradient-to-br from-[#8b80ff] to-[#4a3fc4] tumble"></div>
        <div x-text="mem.text"></div>
      </div>
      <div class="grid gap-[18px] md:grid-cols-2 transition-opacity duration-500" :class="mem.checking ? 'opacity-0' : 'opacity-100'">
        <template x-for="slot in slots" :key="slot.k">
          <section class="panel p-[18px] flex flex-col gap-3.5">
            <div class="flex items-center gap-3">
              <span class="relative grid flex-none w-[34px] h-11 place-items-center rounded-[5px_5px_7px_7px] border border-line2 bg-gradient-to-b from-[#4136a8] to-[#241c69] text-[13px] font-black text-lav" x-text="slot.k"></span>
              <div><b class="block text-[13px] font-black tracking-[.18em]" x-text="`SLOT ${slot.k}`"></b><span class="text-[13px] text-dim" x-text="slot.label"></span></div>
              <span class="ml-auto text-xs text-right text-mute">Free blocks<em class="block font-mono text-sm not-italic text-dim" x-text="slot.free"></em></span>
            </div>
            <div class="grid gap-2.5 grid-cols-[repeat(auto-fill,minmax(96px,1fr))]">
              <template x-for="f in slot.files" :key="f.i">
                <button :data-file="f.i" class="flex flex-col items-center gap-2 px-1.5 pt-3.5 pb-3 rounded-2xl border transition"
                        :class="mem.idx === f.i ? 'tile-on' : 'border-transparent bg-white/[.03]'"
                        @mouseenter="memFocus(f.i, true)" @click="memFocus(f.i); Audio.select()">
                  <img :src="f.src" alt="" class="w-[46px] h-[46px] rounded-lg shadow-[0_4px_12px_rgba(0,0,0,.35)] [image-rendering:pixelated]" :class="mem.idx === f.i && 'bob'">
                  <span class="text-xs font-bold text-center" x-text="f.name"></span>
                </button>
              </template>
            </div>
          </section>
        </template>
        <section class="panel md:col-span-2 grid items-center gap-4 md:gap-5 px-5 py-4 grid-cols-[auto_1fr] md:grid-cols-[auto_minmax(0,1fr)_auto]" aria-live="polite">
          <img :src="memFile.src" alt="" class="w-[68px] h-[68px] rounded-xl [image-rendering:pixelated]">
          <div>
            <h3 class="m-0 mb-1 text-[22px] font-black" x-text="memFile.name"></h3>
            <p x-show="memLine" class="m-0 mb-3 text-sm leading-normal text-dim" x-text="memLine"></p>
            <div x-show="memFile.blocks">
              <template x-for="key in [mem.idx]" :key="key">
                <div class="meter"><template x-for="k in 59" :key="k"><i :class="k <= (memFile.blocks || 0) && 'on'" :style="`--k:${k}`"></i></template></div>
              </template>
            </div>
            <div x-show="!memFile.blocks" class="flex flex-wrap gap-2">
              <template x-for="x in (memFile.items || [])" :key="x"><span class="chip text-dim border-line2" x-text="x"></span></template>
            </div>
          </div>
          <div class="flex items-baseline col-span-2 gap-2.5 md:col-span-1 md:block md:text-right">
            <small class="block text-xs text-mute" x-text="memFile.blocks ? 'Blocks used' : 'Files'"></small>
            <b class="font-mono text-[32px] text-gold"><span x-text="memFile.blocks || (memFile.items || []).length"></span><span x-show="memFile.blocks" class="text-sm text-mute"> / 59</span></b>
          </div>
        </section>
      </div>
    </div>
  </section>

  <!-- CALENDAR -->
  <section x-show="layer === 'calendar'" x-cloak x-transition.opacity.duration.400ms class="absolute inset-0 z-10 flex flex-col pt-[86px] pb-12 px-[clamp(14px,3vw,36px)]" aria-label="Experience">
    <div class="flex flex-col flex-1 min-h-0 gap-[18px] overflow-auto">
      <section class="flex flex-wrap items-end justify-between gap-5 px-6 py-5 panel">
        <div>
          <div class="font-mono font-bold leading-none text-[clamp(46px,8vw,86px)] [text-shadow:0_0_34px_rgba(123,111,240,.7)]">
            <span x-text="clock.h"></span><span class="blink-slow">:</span><span x-text="clock.m"></span><small class="ml-2.5 text-[.36em] text-dim" x-text="clock.s"></small>
          </div>
          <div class="mt-2.5 text-[15px] text-dim" x-text="clock.date"></div>
        </div>
        <div class="flex flex-wrap gap-3.5 text-[13px] text-dim">
          <template x-for="t in Object.values(TYPES)" :key="t.label"><span class="inline-flex items-center gap-1.5"><i class="w-[9px] h-[9px] rounded-full" :style="`background:${t.c};box-shadow:0 0 8px ${t.c}`"></i><span x-text="t.label"></span></span></template>
        </div>
      </section>
      <div class="flex flex-none gap-3 px-0.5 pt-1 pb-3 overflow-x-auto snap-x snap-mandatory">
        <template x-for="(e, j) in calList" :key="j">
          <button :data-cal="j" class="relative flex flex-col items-start justify-between flex-none p-3.5 text-left border rounded-[20px] w-[118px] h-[118px] snap-center transition"
                  :class="cal.idx === j ? 'tile-on -translate-y-[3px]' : 'bg-panel border-line'" @mouseenter="calFocus(j, true)" @click="calFocus(j); Audio.select()">
            <span class="text-[13px] font-extrabold" :class="cal.idx === j ? 'text-gold' : 'text-dim'" x-text="tileLabel(e)"></span>
            <b class="font-mono text-[28px] text-ink" x-text="ym(e.start).y"></b>
            <i class="absolute w-[9px] h-[9px] rounded-full top-4 right-3.5" :style="`background:${typeOf(e).c};box-shadow:0 0 8px ${typeOf(e).c}`"></i>
          </button>
        </template>
      </div>
      <section class="px-6 py-6 panel" aria-live="polite">
        <span class="chip" :style="`color:${typeOf(calItem).c};border-color:${typeOf(calItem).c}55;background:${typeOf(calItem).c}18`" x-text="typeOf(calItem).label"></span>
        <h3 class="mt-2 mb-1 text-[clamp(22px,2.6vw,30px)] font-black" x-text="calItem.title"></h3>
        <div class="mb-1 text-[15px] text-lav" x-text="calItem.org"></div>
        <div class="mb-3.5 text-[13px] text-mute" x-text="fmtPeriod(calItem)"></div>
        <ul x-show="calItem.points.length" class="pts"><template x-for="x in calItem.points" :key="x"><li x-text="x"></li></template></ul>
      </section>
    </div>
  </section>

  <!-- OPTIONS -->
<section
  x-show="layer === 'options'"
  x-cloak
  x-transition.opacity.duration.400ms
  class="absolute inset-0 z-10 flex flex-col pt-[86px] pb-12 px-[clamp(14px,3vw,36px)]"
  aria-label="About and contact"
>
  <div class="grid items-start flex-1 min-h-0 gap-[18px] overflow-auto grid-cols-1 md:grid-cols-2">

    <!-- OPTIONS -->
    <section class="p-2.5 panel order-2 md:order-1">
      <template x-for="row in optRows" :key="row.id">
        <div>

          <div
            x-show="row.sect"
            class="px-4 pt-3.5 pb-1.5 text-xs font-extrabold tracking-[.2em] text-mute"
            x-text="row.sect">
          </div>

          <div
            x-show="!row.sect"
            :data-row="row.n"
            role="button"
            class="flex items-center justify-between gap-3 px-4 py-3.5 border cursor-pointer rounded-2xl transition"
            :class="opt.idx === row.n
              ? 'border-gold/60 bg-gold/10'
              : 'border-transparent'"
            @mouseenter="optFocus(row.n, true)"
            @click="optClick(row, $event)"
          >

            <span
              class="text-[13px] font-black tracking-[.16em]"
              :class="opt.idx === row.n && 'text-gold'"
              x-text="row.k">
            </span>

            <span class="flex items-center gap-2 text-sm text-right text-dim">

              <button
                x-show="row.kind === 'set'"
                data-d="-1"
                aria-label="Previous value"
                class="px-1 transition-opacity text-gold"
                :class="opt.idx === row.n ? 'opacity-100' : 'opacity-0'"
              >
                ◀
              </button>

              <span
                x-show="row.key !== 'pos'"
                x-text="optVal(row)">
              </span>

              <span
                x-show="row.key === 'pos'"
                class="inline-flex gap-[3px]"
              >
                <template x-for="k in 9" :key="k">
                  <i
                    class="w-[5px] h-3.5 rounded-sm"
                    :class="k - 5 === pos
                      ? 'bg-gold'
                      : 'bg-white/15'"
                  ></i>
                </template>
              </span>

              <button
                x-show="row.kind === 'set'"
                data-d="1"
                aria-label="Next value"
                class="px-1 transition-opacity text-gold"
                :class="opt.idx === row.n ? 'opacity-100' : 'opacity-0'"
              >
                ▶
              </button>

            </span>
          </div>
        </div>
      </template>
    </section>


    <!-- ABOUT -->
    <section class="p-6 panel order-1 md:order-2">

      <!-- TEXT + IMAGE SIDE BY SIDE -->
      <div class="grid items-center gap-6 md:grid-cols-[1fr_220px]">

        <!-- TEXT -->
        <div>

          <span
            class="inline-flex items-center gap-2 px-3 py-1.5 text-[13px] font-bold rounded-full text-padA bg-padA/10 border border-padA/35"
          >
            <i class="w-2 h-2 rounded-full bg-padA pulse"></i>
            <span x-text="C.status"></span>
          </span>

          <h3
            class="mt-4 mb-0.5 text-[clamp(26px,3vw,34px)] font-black"
            x-text="C.name">
          </h3>

          <div
            class="mb-3.5 text-[15px] text-lav"
            x-text="C.role">
          </div>

          <p
            class="m-0 text-[15px] leading-[1.65] text-[#dcd7fb] max-w-[62ch]"
            x-text="C.about">
          </p>

        </div>


        <!-- IMAGE ON RIGHT -->
        <div
          class="relative w-full overflow-hidden border rounded-2xl border-line bg-white/[.04] aspect-square"
        >
          <img
            src="./quidon.jpg"
            alt="About me"
          >
        </div>

      </div>


      <!-- STATS -->
      <div class="grid grid-cols-3 gap-2.5 mt-6">

        <template x-for="s in C.stats" :key="s.k">

          <div class="p-3.5 border rounded-2xl bg-white/[.04] border-line">

            <b
              class="block mb-0.5 text-base font-black sm:text-xl"
              x-text="s.v">
            </b>

            <span
              class="text-xs text-dim"
              x-text="s.k">
            </span>

          </div>

        </template>

      </div>

    </section>

  </div>
</section>
  </section>

  <!-- HINTS + TOAST -->
  <div class="absolute z-30 flex gap-3 sm:gap-[18px] text-[11px] sm:text-xs -translate-x-1/2 pointer-events-none left-1/2 bottom-4 text-dim whitespace-nowrap transition-opacity duration-300" :class="hints.length ? 'opacity-100' : 'opacity-0'">
    <template x-for="h in hints" :key="h[2]"><span class="inline-flex items-center gap-1.5"><span class="kb" :class="h[1]" x-text="h[0]"></span><span x-text="h[2]"></span></span></template>
  </div>
  <div role="status" class="absolute z-50 px-[18px] py-2.5 text-sm -translate-x-1/2 border rounded-full pointer-events-none left-1/2 top-5 bg-void/90 border-line2 whitespace-nowrap transition duration-300"
       :class="toast.on ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4'" x-text="toast.msg"></div>
  <div id="fx"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./Js/Config.js"></script>
<script src="./Js/Utils.js"></script>
<script src="./Js/Audio.js"></script>
<script src="./Js/Engine.js"></script>
<script src="./Js/AlpineApp.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</body>
