<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIMELINE · EDUCATION & EXPERIENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Days+One&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  [x-cloak]{display:none!important}

  body{
    font-family:'Quicksand',sans-serif;
    background:#0d0c24;
    /* Glove hand cursor, like the original BIOS */
    cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="30" viewBox="0 0 26 30"><path d="M10 1.5c1.3 0 2.3 1 2.3 2.3v9.4l7.6 1.6c1.8.4 3 2 3 3.8 0 4.6-3 9.9-10.4 9.9-5.4 0-8.3-2.5-10.1-6L1 19.6c-.7-1.3-.2-2.9 1.1-3.6 1.1-.6 2.5-.3 3.3.7l1.3 1.7V3.8C6.7 2.5 7.7 1.5 9 1.5z" fill="%23ffffff" stroke="%23151527" stroke-width="1.6" stroke-linejoin="round"/></svg>') 10 2, auto;
  }
  button{cursor:inherit;font-family:'Quicksand',sans-serif}

  /* ---------- Yellow BIOS cursor ring ---------- */
  .cursor-ring{
    position:absolute;top:0;left:0;z-index:10;pointer-events:none;opacity:0;
    border:5px solid #ffd21e;border-radius:16px;
    box-shadow:0 0 0 1.5px rgba(20,18,58,.5), 0 10px 24px -10px rgba(255,210,30,.4);
    transition:transform .2s cubic-bezier(.3,1.5,.5,1), width .2s cubic-bezier(.3,1.5,.5,1), height .2s cubic-bezier(.3,1.5,.5,1), opacity .16s ease;
    animation:ringPulse 2.2s ease-in-out infinite;
  }
  @keyframes ringPulse{
    0%,100%{box-shadow:0 0 0 1.5px rgba(20,18,58,.5),0 10px 24px -10px rgba(255,210,30,.3)}
    50%{box-shadow:0 0 0 1.5px rgba(20,18,58,.5),0 10px 30px -8px rgba(255,210,30,.55)}
  }

  /* ---------- Chips / tabs / buttons ---------- */
  .chip{font-size:10px;font-weight:700;letter-spacing:.12em;padding:.25rem .5rem;border-radius:7px;background:rgba(255,255,255,.06);color:#a29dd0;border:1px solid rgba(255,255,255,.06)}
  .chip-rw{color:#9be8b0;border-color:rgba(110,231,145,.25);background:rgba(110,231,145,.07)}
  .chip-gold{color:#ffd21e;border-color:rgba(255,210,30,.28);background:rgba(255,210,30,.07)}
  .tab{padding:.5rem .95rem;border-radius:14px;border:1px solid transparent;transition:all .2s;text-align:left;line-height:1.15}
  .tab-on{background:#5b50b8;border-color:#7d71e0;color:#fff;box-shadow:0 8px 18px -8px rgba(91,80,184,.8), inset 0 1px 0 rgba(255,255,255,.25)}
  .tab-off{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08);color:#8f8ac2}
  .tab-off:hover{background:rgba(255,255,255,.08);color:#cfc9f2}
  .fbtn{padding:.42rem .85rem;border-radius:11px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);color:#8f8ac2;font-size:10.5px;font-weight:700;letter-spacing:.16em;transition:all .18s}
  .fbtn:hover{color:#cfc9f2;background:rgba(255,255,255,.08)}
  .fbtn.on-edu{background:rgba(110,231,145,.12);border-color:rgba(110,231,145,.4);color:#9be8b0}
  .fbtn.on-work{background:rgba(255,210,30,.1);border-color:rgba(255,210,30,.4);color:#ffd21e}
  .fbtn:focus-visible{outline:2px solid rgba(255,210,30,.6);outline-offset:3px}
  .navb{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#a29dd0;transition:all .15s}
  .navb:hover{background:#5b50b8;border-color:#7d71e0;color:#fff}
  .navb:focus-visible{outline:2px solid rgba(255,210,30,.6);outline-offset:3px}

  /* ---------- Ambient background (your original) ---------- */
  .dotgrid{
    background-image:radial-gradient(rgba(185,166,242,.09) 1px, transparent 1.4px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(80% 70% at 50% 40%, #000 30%, transparent 100%);
    mask-image:radial-gradient(80% 70% at 50% 40%, #000 30%, transparent 100%);
  }
  .shape{position:absolute;border:2px solid rgba(185,166,242,.07);border-radius:26%;animation:drift linear infinite}
  .shape.gold{border-color:rgba(255,210,30,.06)}
  @keyframes drift{
    0%{transform:rotate(0) translate(0,0)}
    50%{transform:rotate(180deg) translate(26px,-22px)}
    100%{transform:rotate(360deg) translate(0,0)}
  }
  .vignette{background:radial-gradient(115% 90% at 50% 8%, transparent 45%, rgba(4,3,14,.62) 100%)}

  /* ---------- Idle animations ---------- */
  .a-float,.a-dash{transform-box:fill-box;transform-origin:center}
  .a-float{animation:floaty 2.6s ease-in-out infinite}
  .a-dash{animation:dashy 1.4s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(3px)}50%{transform:translateY(-4px)}}
  @keyframes dashy{0%,100%{opacity:.25}50%{opacity:.9}}

  /* ---------- Page layout ---------- */
  html{scrollbar-color:#4a4390 #14122e}
  body{margin:0;min-height:100vh;overflow-x:hidden;color:#c9c3ec;padding-bottom:96px}
  .bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .bgfx .dotgrid,.bgfx .vignette{position:absolute;inset:0}
  .page{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:1.6rem clamp(1.1rem,4vw,2rem) 7rem}

  header{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:.95rem}
  .logo{width:44px;height:44px;flex:none}
  .brand h1{margin:0;font-family:'Days One',sans-serif;font-weight:400;font-size:clamp(1.45rem,3.2vw,2rem);letter-spacing:.06em;color:#f2efff}
  .brand p{margin:.2rem 0 0;font-size:9.5px;font-weight:700;letter-spacing:.26em;color:#8f8ac2}
  .hnav{margin-left:auto;display:flex;gap:.55rem;flex-wrap:wrap}
  .hnav .tab{display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:11.5px;letter-spacing:.12em}

  .stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:3rem;align-items:start;margin-top:2.2rem}

  /* ---------- Timeline ---------- */
  .tlzone{display:flex;flex-direction:column;align-items:center;min-width:0}
  .kicker{text-align:center;margin-bottom:1.4rem}
  .kicker h2{margin:0;font-family:'Days One',sans-serif;font-weight:400;font-size:1.55rem;letter-spacing:.2em;color:#f2efff}
  .kicker p{margin:.45rem 0 0;font-size:9.5px;font-weight:700;letter-spacing:.26em;color:#8f8ac2}
  .filters{display:flex;gap:.5rem;margin-bottom:1.6rem;flex-wrap:wrap;justify-content:center}

  .tl{position:relative;width:100%;max-width:560px;padding:0 0 1rem}
  /* the dashed spine */
  .tl::before{
    content:'';position:absolute;left:11px;top:8px;bottom:8px;width:0;
    border-left:2px dashed rgba(185,166,242,.25);
  }

  .titem{position:relative;display:grid;grid-template-columns:24px 1fr;gap:1rem;padding:.35rem 0;opacity:0;transform:translateX(-16px);transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1)}
  .titem.in{opacity:1;transform:none}
  .titem:last-child .tcard{margin-bottom:0}

  /* node on the spine */
  .tnode{position:relative;display:flex;justify-content:center;padding-top:1.45rem}
  .tdot{
    width:13px;height:13px;border-radius:50%;flex:none;position:relative;z-index:2;
    border:2.5px solid #0d0c24;
  }
  .tdot.edu{background:#6ee791;box-shadow:0 0 0 3px rgba(110,231,145,.18), 0 0 14px rgba(110,231,145,.55)}
  .tdot.work{background:#ffd21e;box-shadow:0 0 0 3px rgba(255,210,30,.18), 0 0 14px rgba(255,210,30,.55)}
  .tdot::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1.5px solid currentColor;opacity:0}
  .titem.sel .tdot.edu{animation:nodebeat 1.6s ease-in-out infinite}
  .titem.sel .tdot.work{animation:nodebeat 1.6s ease-in-out infinite}
  @keyframes nodebeat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

  .tcard{
    position:relative;width:100%;text-align:left;
    background:rgba(255,255,255,.028);border:1px solid rgba(185,166,242,.13);
    border-radius:16px;padding:.95rem 1.1rem;
    transition:background .18s, border-color .18s, transform .18s;-webkit-tap-highlight-color:transparent;
  }
  .tcard:hover{background:rgba(255,255,255,.055);transform:translateX(3px)}
  .titem.sel .tcard{border-color:rgba(255,210,30,.45);background:rgba(255,210,30,.05)}
  .tcard:focus-visible{outline:2px solid rgba(255,210,30,.6);outline-offset:3px}
  .ttop{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
  .tyear{font-family:'Days One',sans-serif;font-size:.78rem;letter-spacing:.1em}
  .tyear.edu{color:#6ee791}.tyear.work{color:#ffd21e}
  .tnow{font-size:8px;font-weight:800;letter-spacing:.16em;color:#0d0c24;background:#ffd21e;border-radius:5px;padding:.13rem .4rem;box-shadow:0 4px 10px -3px rgba(255,210,30,.6)}
  .ttitle{margin-top:.35rem;font-weight:700;font-size:.92rem;color:#f2efff;letter-spacing:.03em;line-height:1.35}
  .torg{margin-top:.28rem;font-size:9.5px;font-weight:700;letter-spacing:.18em;color:#8f8ac2}
  .titem.sel .ttitle{color:#fff}

  .hint{margin-top:1.3rem;font-size:9.5px;font-weight:700;letter-spacing:.22em;color:#6f6a9e;text-align:center}
  .legend{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap;justify-content:center;margin-top:.9rem}
  .lg{display:inline-flex;align-items:center;gap:.45rem;font-size:9.5px;font-weight:700;letter-spacing:.16em;color:#8f8ac2}
  .lgdot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .lgdot.edu{background:#6ee791;box-shadow:0 0 8px rgba(110,231,145,.5)}
  .lgdot.work{background:#ffd21e;box-shadow:0 0 8px rgba(255,210,30,.5)}

  .swap{animation:panelIn .22s ease}
  @keyframes panelIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- Record panel ---------- */
  .panel{
    position:sticky;top:1.4rem;
    background:#17153a;border:1px solid rgba(185,166,242,.2);border-radius:22px;
    padding:1.45rem 1.5rem 1.5rem;box-shadow:0 34px 70px -34px rgba(0,0,0,.7);
  }
  .phead{display:flex;align-items:center;gap:1rem}
  .picon{width:60px;height:60px;flex:none;display:grid;place-items:center;border-radius:25%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)}
  .pindex{margin-left:auto;font-family:'Days One',sans-serif;font-size:.72rem;letter-spacing:.12em;color:#6f6a9e}
  .pname{font-weight:700;font-size:1.02rem;color:#fff;letter-spacing:.02em;line-height:1.35}
  .ptitle{margin-top:.32rem;font-size:9.5px;font-weight:700;letter-spacing:.2em;color:#8f8ac2}
  .pmeta{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.05rem}
  .pdiv{border-top:1px dashed rgba(185,166,242,.22);margin:1.05rem 0 1.1rem}
  .pbody{min-height:12.5rem}
  .pbody p{color:#c9c3ec;font-size:13.5px;line-height:1.7;margin:0 0 .8rem}
  .pbody p.sub{color:#8f8ac2;font-size:12.5px}
  .footnote{font-size:11px!important;color:#6f6a9e!important;font-style:italic;margin-top:.9rem!important}
  .pnav{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1.15rem}
  .pnavhint{font-size:9px;font-weight:700;letter-spacing:.2em;color:#6f6a9e}

  /* ---------- Bottom BIOS bar ---------- */
  .biosbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:.95rem;background:#1d1a49;border:1px solid rgba(185,166,242,.28);border-radius:999px;padding:.6rem 1.35rem;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);white-space:nowrap;max-width:calc(100vw - 1.4rem)}
  .biosbar span{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:#9d97cf}
  .biosbar .led{width:8px;height:8px;border-radius:3px;background:#ffd21e;flex:none}
  .biosbar .clock{font-family:'Days One',sans-serif;font-weight:400;font-size:11.5px;letter-spacing:.1em;color:#ffd21e}
  .biosbar .sep{width:1px;height:13px;background:rgba(185,166,242,.3)}

  @media(max-width:980px){.stage{grid-template-columns:1fr}.panel{position:static}}
  @media(max-width:640px){.hnav{margin-left:0;width:100%}}
  @media(max-width:480px){.biosbar{gap:.6rem;padding:.55rem .95rem}.biosbar .date,.biosbar .s1{display:none}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body x-data="tl()" @keydown.arrow-up.window.prevent="move(-1)" @keydown.arrow-down.window.prevent="move(1)">
<noscript><div style="max-width:30rem;margin:20vh auto;text-align:center;font-weight:700;color:#8f8ac2">This timeline needs JavaScript. Please enable it.</div></noscript>

<!-- ambient background: your original dotgrid + drifting shapes + vignette -->
<div class="bgfx" aria-hidden="true">
  <div class="dotgrid"></div>
  <div class="shape" style="width:190px;height:190px;top:12%;left:7%;animation-duration:27s"></div>
  <div class="shape gold" style="width:120px;height:120px;top:64%;left:14%;animation-duration:21s;animation-delay:-6s"></div>
  <div class="shape" style="width:150px;height:150px;top:22%;right:9%;animation-duration:31s;animation-delay:-11s"></div>
  <div class="shape gold" style="width:90px;height:90px;top:74%;right:18%;animation-duration:19s;animation-delay:-3s"></div>
  <div class="shape" style="width:70px;height:70px;top:44%;left:44%;animation-duration:24s;animation-delay:-14s"></div>
  <div class="shape" style="width:240px;height:240px;top:-60px;left:52%;animation-duration:36s;animation-delay:-8s"></div>
  <div class="vignette"></div>
</div>

<div class="page" x-cloak>
  <header>
    <div class="brand">
      <svg class="logo a-float" viewBox="0 0 48 48" fill="none" stroke="#ffd21e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M24 5.5 40 14v20L24 42.5 8 34V14Z"/><path d="M8 14l16 8.5L40 14"/><path d="M24 22.5V42.5"/>
      </svg>
      <div>
        <h1>TIMELINE</h1>
        <p>EDUCATION & EXPERIENCE · PLAYER 1</p>
      </div>
    </div>
    <nav class="hnav" aria-label="Site">
      <a class="tab tab-off" href="index.html">HOME</a>
      <a class="tab tab-off" href="projects.html">PROJECTS</a>
      <span class="tab tab-on" aria-current="page">TIMELINE</span>
      <a class="tab tab-off" href="about.html">ABOUT</a>
    </nav>
  </header>

  <main class="stage">
    <!-- ============ the timeline ============ -->
    <section class="tlzone">
      <div class="kicker">
        <h2>TIMELINE</h2>
        <p x-text="items.length + ' MILESTONES · ' + eduCount + ' EDU · ' + workCount + ' WORK'"></p>
      </div>

      <div class="filters" role="group" aria-label="Filter timeline">
        <button type="button" class="fbtn" :class="{on: filter==='all'  }" :style="filter==='all' ? 'background:rgba(185,166,242,.12);border-color:rgba(185,166,242,.4);color:#cfc9f2' : ''" @click="setFilter('all')">ALL</button>
        <button type="button" class="fbtn" :class="{'on-edu': filter==='edu'}" @click="setFilter('edu')">EDUCATION</button>
        <button type="button" class="fbtn" :class="{'on-work': filter==='work'}" @click="setFilter('work')">WORK</button>
      </div>

      <div class="tl" x-ref="tl" @mouseleave="ringBack()">
        <template x-for="(item, i) in view" :key="item.id">
          <div class="titem" :class="{sel: sel === item.id}" :data-id="item.id">
            <!-- node on the spine -->
            <div class="tnode"><i class="tdot" :class="item.type"></i></div>

            <!-- entry card -->
            <button type="button" class="tcard"
                    @click="select(item.id, true)" @mouseenter="preview(item.id, $el)" @focus="preview(item.id, $el)">
              <div class="ttop">
                <span class="tyear" :class="item.type" x-text="item.year"></span>
                <span class="tnow" x-show="item.now">NOW</span>
              </div>
              <div class="ttitle" x-text="item.title"></div>
              <div class="torg" x-text="item.org"></div>
            </button>
          </div>
        </template>
        <div class="cursor-ring" :style="ringStyle" aria-hidden="true"></div>
      </div>

      <p class="hint">HOVER OR &#8593;/&#8595; TO BROWSE · CLICK TO OPEN THE RECORD</p>
      <div class="legend">
        <span class="lg"><i class="lgdot edu"></i> EDUCATION</span>
        <span class="lg"><i class="lgdot work"></i> WORK</span>
      </div>
    </section>

    <!-- ============ record panel ============ -->
    <aside class="panel" aria-live="polite">
      <div class="phead">
        <div class="picon" x-html="current.icon"></div>
        <div style="min-width:0">
          <div class="pname" x-text="current.title"></div>
          <div class="ptitle" x-text="current.org"></div>
        </div>
        <span class="pindex" x-text="String(idx + 1).padStart(2,'0') + '/' + String(view.length).padStart(2,'0')"></span>
      </div>
      <div class="pmeta">
        <span class="chip" :class="current.type === 'edu' ? 'chip-rw' : 'chip-gold'" x-text="'TYPE · ' + (current.type === 'edu' ? 'EDUCATION' : 'WORK')"></span>
        <span class="chip" x-text="'PERIOD · ' + current.period"></span>
        <span class="chip" x-text="'LOGGED · ' + current.year"></span>
      </div>
      <div class="pdiv"></div>

      <div class="pbody">
        <template x-for="c in [current]" :key="sel">
          <div class="swap">
            <p x-text="current.desc"></p>
            <p class="sub" x-text="current.note"></p>
            <p class="footnote" x-text="current.type === 'edu' ? 'Saved to the education block. Cannot be rewritten, only remembered.' : 'Signed by the studio. Experience points were awarded.'"></p>
          </div>
        </template>
      </div>

      <div class="pdiv"></div>
      <div class="pnav">
        <button type="button" class="navb" @click="move(-1)" aria-label="Previous entry">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
        </button>
        <span class="pnavhint">PREV / NEXT ENTRY</span>
        <button type="button" class="navb" @click="move(1)" aria-label="Next entry">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg>
        </button>
      </div>
    </aside>
  </main>
</div>

<!-- BIOS bottom bar -->
<footer class="biosbar" x-cloak>
  <span class="led a-dash"></span>
  <span x-text="'TIMELINE · ' + items.length + ' MILESTONES'"></span>
  <span class="sep s1"></span>
  <span class="date" x-text="dateStr"></span>
  <span class="sep"></span>
  <span class="clock" x-text="clock"></span>
</footer>

<script>
/* ================================================================
   ✏️  EDIT YOUR MILESTONES HERE — newest first, top of the page.
   type: 'edu' (green) | 'work' (gold)
   now : true puts the yellow NOW badge on the entry
   ================================================================ */
const LOG = [
  { id:'launch', type:'work', year:'2025', period:'JUN 2025', now:true,
    title:'PORTFOLIO v3 LAUNCHED', org:'THIS VERY SITE',
    desc:'The site you are standing in. A BIOS-styled portfolio with a glove cursor, a memory of sound settings, and a timeline that smells faintly of plastic.',
    note:'Built with too much love for a system menu. Zero regrets.' },
  { id:'free',   type:'work', year:'2022', period:'2022 — NOW', now:true,
    title:'INDEPENDENT · FRONTEND + MOTION', org:'SELF-EMPLOYED',
    desc:'Went solo. Since then: playful, production-grade web things for teams that sweat the details — design systems, motion passes, and the occasional shader.',
    note:'Clients report unusually high easing-curve quality. Coincidence?' },
  { id:'cert',   type:'edu',  year:'2021', period:'JAN 2021',
    title:'CERTIFICATE · MOTION DESIGN', org:'SCHOOL OF MOTION (ONLINE)',
    desc:'Nights-and-weekends course on animation principles. Squash, stretch, anticipation — and the discovery that 200ms is a personality trait.',
    note:'Permanently rewired how I see every interface on earth.' },
  { id:'job1',   type:'work', year:'2020', period:'2020 — 2022',
    title:'FRONTEND DEVELOPER', org:'PIXELWORKS STUDIO',
    desc:'First real job. Shipped client sites, rebuilt the component library from scratch, and learned what code review is actually for — the hard way, twice.',
    note:'Survived two rebrands and one server fire. Not my fire.' },
  { id:'grad',   type:'edu',  year:'2019', period:'CLASS OF 2019',
    title:'GRADUATED · BSc COMPUTER SCIENCE', org:'UNIVERSITY OF LISBON',
    desc:'Thesis on real-time rendering in the browser — the exact moment "browser" and "graphics" fused into one career. Walked the stage, started three side projects that same week.',
    note:'The diploma is framed. The side projects are still running.' },
  { id:'uni',    type:'edu',  year:'2015', period:'2015 — 2019',
    title:'STARTED BSc COMPUTER SCIENCE', org:'UNIVERSITY OF LISBON',
    desc:'Four years of algorithms, all-nighters and one fateful elective called "Introduction to Web Technologies". The elective won the war for my soul.',
    note:'Spawn point of the whole journey. Press START to continue.' }
];

/* ---------- derived data ---------- */
const TYPE = {
  edu:  { color:'#6ee791' },
  work: { color:'#ffd21e' }
};
const tIcon = t => '<svg viewBox="0 0 48 48" width="28" height="28" fill="none" stroke="' + TYPE[t].color
  + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + (t === 'edu'
      ? '<path d="M24 11 44 20 24 29 4 20Z"/><path d="M13 25v6.6c0 3.6 22 3.6 22 0V25"/><path d="M44 20v8.5"/>'
      : '<rect x="7" y="16" width="34" height="21" rx="4"/><path d="M17.5 16v-4.2A3.8 3.8 0 0 1 21.3 8h5.4a3.8 3.8 0 0 1 3.8 3.8V16"/><path d="M7 25.5h34"/>')
  + '</svg>';

const ITEMS = LOG.map(e => ({ ...e, icon: tIcon(e.type) }));

/* ---------- console state ---------- */
function tl() {
  return {
    items: ITEMS,
    filter: 'all',
    sel: ITEMS[0].id,
    ring: { x: 0, y: 0, w: 0, h: 0, visible: false },
    clock: '', dateStr: '', ac: null, io: null,

    get view() {
      return this.filter === 'all' ? this.items : this.items.filter(i => i.type === this.filter);
    },
    get current() { return this.view.find(i => i.id === this.sel) || this.view[0]; },
    get idx()     { return Math.max(0, this.view.findIndex(i => i.id === this.sel)); },
    get eduCount()  { return this.items.filter(i => i.type === 'edu').length; },
    get workCount() { return this.items.filter(i => i.type === 'work').length; },
    get ringStyle() {
      const r = this.ring;
      return 'transform:translate(' + r.x + 'px,' + r.y + 'px);width:' + r.w + 'px;height:' + r.h + 'px;opacity:' + (r.visible ? 1 : 0);
    },

    init() {
      this.tick();
      setInterval(() => this.tick(), 1000);

      /* entries slide in as they scroll into view */
      this.io = new IntersectionObserver(entries => {
        entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); this.io.unobserve(en.target); } });
      }, { threshold: .18 });
      this.$nextTick(() => {
        document.querySelectorAll('.titem').forEach(el => this.io.observe(el));
        this.ringBack();
      });
      window.addEventListener('resize', () => { if (this.ring.visible) this.ringBack(); });
    },

    tick() {
      const d = new Date();
      this.clock = d.toLocaleTimeString('en-GB', { hour12: false });
      this.dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit' }).toUpperCase().replace(/,/g, '');
    },

    setFilter(f) {
      if (this.filter === f) return;
      this.filter = f;
      this.blip(760, .05);
      this.$nextTick(() => {
        /* re-observe new cards so they animate in */
        document.querySelectorAll('.titem:not(.in)').forEach(el => this.io.observe(el));
        /* keep selection inside the filtered view */
        if (!this.view.find(i => i.id === this.sel)) this.sel = this.view[0].id;
        document.querySelectorAll('.titem').forEach(el => { el.classList.remove('in'); this.io.observe(el); });
        this.ringBack();
      });
    },

    /* hover previews; click commits */
    preview(id, el) { this.sel = id; this.ringTo(el); this.blip(660, .03); },
    select(id, clicked) {
      this.sel = id;
      if (clicked) this.blip(940, .06);
      this.$nextTick(() => this.ringBack());
    },
    move(d) {
      const i = this.idx;
      const n = this.view[(i + d + this.view.length) % this.view.length];
      this.sel = n.id;
      this.blip(700, .045);
      this.$nextTick(() => {
        const el = this.entryEl(n.id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        this.ringBack();
      });
    },

    entryEl(id) { return this.$refs.tl ? this.$refs.tl.querySelector('.titem[data-id="' + id + '"] .tcard') : null; },

    /* yellow ring snap — measured on the card, positioned on the .tl container */
    ringTo(el) {
      if (!el || !this.$refs.tl) return;
      const t = this.$refs.tl.getBoundingClientRect(), r = el.getBoundingClientRect();
      this.ring = { x: r.left - t.left, y: r.top - t.top, w: r.width, h: r.height, visible: true };
    },
    ringBack() {
      const el = this.entryEl(this.sel);
      if (el) this.ringTo(el); else this.ring.visible = false;
    },

    /* menu blip — synthesized, no files */
    blip(freq = 880, dur = .07) {
      try {
        this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = 'square'; o.frequency.value = freq;
        g.gain.setValueAtTime(.035, this.ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.0001, this.ac.currentTime + dur);
        let node = o.connect(g);
        if (this.ac.createStereoPanner) {
          const pan = this.ac.createStereoPanner();
          pan.pan.value = .4;
          node = node.connect(pan);
        }
        node.connect(this.ac.destination);
        o.start(); o.stop(this.ac.currentTime + dur);
      } catch (e) {}
    }
  };
}
</script>
</body>
</html>
