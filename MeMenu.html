<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABOUT ME · OPTIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Days+One&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<link rel="stylesheet" href="Css/GameCubeProjects.css">

</head>
<body x-data="options()" @keydown.arrow-up.window.prevent="move(-1)" @keydown.arrow-down.window.prevent="move(1)"
      @keydown.enter.window="if(document.activeElement.tagName!=='BUTTON') activate(current.id)">
<noscript><div style="max-width:30rem;margin:20vh auto;text-align:center;font-weight:700;color:#8f8ac2">This system menu needs JavaScript. Please enable it.</div></noscript>

<!-- ambient background: your original dotgrid + drifting shapes + vignette -->
<div class="bgfx" aria-hidden="true">
  <div class="dotgrid"></div>
  <div class="shape" style="width:190px;height:190px;top:12%;left:7%;animation-duration:27s"></div>
  <div class="shape gold" style="width:120px;height:120px;top:64%;left:14%;animation-duration:21s;animation-delay:-6s"></div>
  <div class="shape" style="width:150px;height:150px;top:22%;right:9%;animation-duration:31s;animation-delay:-11s"></div>
  <div class="shape gold" style="width:90px;height:90px;top:74%;right:18%;animation-duration:19s;animation-delay:-3s"></div>
  <div class="shape" style="width:70px;height:70px;top:44%;left:44%;animation-duration:24s;animation-delay:-14s"></div>
  <div class="shape" style="width:240px;height:240px;top:-60px;left:52%;animation-duration:36s;animation-delay:-8s"></div>
  <div class="vignette"></div>
</div>

<div class="page" x-cloak>
  <header>
    <div class="brand">
      <svg class="logo a-float" viewBox="0 0 48 48" fill="none" stroke="#ffd21e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M24 5.5 40 14v20L24 42.5 8 34V14Z"/><path d="M8 14l16 8.5L40 14"/><path d="M24 22.5V42.5"/>
      </svg>
      <div>
        <h1>ABOUT ME</h1>
        <p>SYSTEM CONFIGURATION · PLAYER 1</p>
      </div>
    </div>
    <nav class="hnav" aria-label="Site">
      <a class="tab tab-off" href="index.html">HOME</a>
      <a class="tab tab-off" href="projects.html">PROJECTS</a>
      <span class="tab tab-on" aria-current="page">ABOUT</span>
    </nav>
  </header>

  <main class="stage">
    <!-- ============ the OPTIONS list ============ -->
    <section class="menu" x-ref="menu" aria-label="About sections" @mouseleave="ringBack()">
      <div class="kicker">
        <h2>OPTIONS</h2>
        <p x-text="'SELECT AN ENTRY · ' + items.length + ' SETTINGS'"></p>
      </div>

      <div class="rows">
        <template x-for="item in items" :key="item.id">
          <button type="button" class="row" :class="{sel: sel === item.id}" :data-id="item.id"
                  @click="activate(item.id)" @mouseenter="setSel(item.id); ringTo($el)" @focus="setSel(item.id); ringTo($el)">
            <span class="ric" x-html="item.icon"></span>
            <span class="rlab" x-text="item.label"></span>
            <span class="rval" x-text="rowValue(item)"></span>
          </button>
        </template>
      </div>

      <div class="cursor-ring" :style="ringStyle" aria-hidden="true"></div>
    </section>

    <!-- ============ description panel ============ -->
    <aside class="panel" aria-live="polite">
      <div class="phead">
        <div class="picon" x-html="current.icon"></div>
        <div>
          <div class="pname" x-text="current.label"></div>
          <div class="ptitle" x-text="current.title"></div>
        </div>
      </div>
      <div class="pdiv"></div>

      <div class="pbody">
        <!-- keyed by sel so the entry animation replays on every change -->
        <template x-for="c in [current]" :key="sel">
          <div class="swap" x-html="c.body"></div>
        </template>
      </div>

      <!-- contextual action under the panel -->
      <div class="pact">
        <template x-if="sel === 'contact'">
          <button type="button" class="actbtn act-copy" @click="copyEmail()">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.8"/><path d="M3 10.5V3.8C3 2.8 3.8 2 4.8 2h6.7"/></svg>
            COPY EMAIL
          </button>
        </template>
        <template x-if="sel === 'sound'">
          <div class="sndbtns">
            <button type="button" :class="sound==='STEREO' ? 'dbtn dbtn-primary' : 'dbtn dbtn-ghost'" @click="setSound('STEREO')">STEREO</button>
            <button type="button" :class="sound==='MONO'   ? 'dbtn dbtn-primary' : 'dbtn dbtn-ghost'" @click="setSound('MONO')">MONO</button>
            <button type="button" :class="sound==='OFF'    ? 'dbtn dbtn-primary' : 'dbtn dbtn-ghost'" @click="setSound('OFF')">OFF</button>
          </div>
        </template>
      </div>
    </aside>
  </main>
</div>

<!-- BIOS bottom bar -->
<footer class="biosbar" x-cloak>
  <span class="led a-dash"></span>
  <span>OPTIONS</span>
  <span class="sep s1"></span>
  <span class="date" x-text="dateStr"></span>
  <span class="sep"></span>
  <span class="clock" x-text="clock"></span>
</footer>

<!-- toast -->
<div class="toast" :class="{show: toast.on}" x-cloak role="status" x-text="toast.msg"></div>

<script>
/* ================================================================
   ✏️  EDIT EVERYTHING HERE — this is the whole About page content
   ================================================================ */
const ME = {
  name:  'Quidon Roethof',                // your name
  email: 'quidonroethof4@gmail.com',      // your email
  city:  'Lelystad, Netherlands',
  tz:    'Europe/Amsterdam',            // IANA timezone for the live clock
  tzLabel: 'UTC+0',
  github:   'https://github.com/cyd-n',
  linkedin: 'https://www.linkedin.com/in/quidon-roethof-97794a2ab/',
  bio: [
    'A Junior BackEnd developer with a great passion and love of C#, Retro tech/ games, low level, systems and OS. I am searching for a 32 hours BackEnd-Dev position for mine Deeltijd HBO studie',
    ''
  ],
  now: [
    ['PLAYING',   'Wind Waker — fourth run'],
    ['LEARNING',  'GLSL, one shader at a time'],
    ['LISTENING', 'Jazz + rain on loop'],
    ['STATUS',    'Open for freelance']
  ]
};

/* ---------- tiny HTML builders ---------- */
const I = (cls, inner) =>
  '<svg class="' + cls + '" viewBox="0 0 48 48" fill="none" stroke="#cfc9f2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
const arrow  = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13 13 3M6.5 3H13v6.5"/></svg>';
const nowrow = (l, v) => '<div class="nowrow"><span class="nowlab">' + l + '</span><span class="nowval">' + v + '</span></div>';
const tlrow  = (y, t) => '<div class="tlrow"><span class="tlyear">' + y + '</span><p>' + t + '</p></div>';

/* ---------- the menu entries ---------- */
const ITEMS = [
  { id: 'profile', label: 'PROFILE', title: 'ENTRY 01 · PLAYER PROFILE',
    icon: I('a-hover', '<circle cx="24" cy="16" r="7.5"/><path d="M10.5 41c1.3-9.6 6.6-14.2 13.5-14.2s12.2 4.6 13.5 14.2"/>'),
    body: '<p>Hi — I\u2019m <b>' + ME.name + '</b>. ' + ME.bio[0] + '</p>'
        + '<p class="sub">' + ME.bio[1] + '</p>'
        + '<div class="tagrow"><span class="chip">CLASS · BACKEND DEV</span><span class="chip">LVL · 24</span><span class="chip">SPAWN · ' + ME.city + '</span></div>'
        + '<p class="footnote">This profile file cannot be modified. I\u2019ve tried.</p>' },

  { id: 'now', label: 'NOW', title: 'ENTRY 03 · LIVE STATUS',
    icon: I('a-float', '<path d="M24 8.5V22"/><path d="M15 14.8a13.2 13.2 0 1 0 18 0"/>'),
    body: '<p>Current session data, updating in real life:</p>'
        + ME.now.map(r => nowrow(r[0], r[1])).join('')
        + '<p class="footnote">Values drift without warning. Like weather, but nerdier.</p>' },

  { id: 'location', label: 'LOCATION', title: 'ENTRY 04 · SPAWN POINT',
    icon: I('a-rays', '<circle cx="24" cy="24" r="14"/><ellipse cx="24" cy="24" rx="6.5" ry="14"/><path d="M10 24h28M12.5 16.5h23M12.5 31.5h23"/>'),
    body: '<div class="bigclock liveclock">--:--:--</div>'
        + '<div class="bigdate">' + ME.city + ' · ' + ME.tzLabel + '</div>'
        + '<p class="sub" style="margin-top:1rem">The clock runs on the same heartbeat as the bottom bar. If both stop, unplug the console.</p>' },

  { id: 'contact', label: 'CONTACT', title: 'ENTRY 05 · COMMS CHANNEL',
    icon: I('a-punch', '<rect x="9.5" y="13.5" width="29" height="22" rx="5"/><path d="M11 16.8 24 26.8 37 16.8"/>'),
    body: '<a class="maillink" href="mailto:' + ME.email + '">' + ME.email + ' ' + arrow + '</a>'
        + '<p class="sub">Fastest route. Use COPY EMAIL below — the address lands on your clipboard.</p>'
        + '<a class="linkrow" href="' + ME.github + '" target="_blank" rel="noopener">GITHUB ' + arrow + '</a>'
        + '<a class="linkrow" href="' + ME.linkedin + '" target="_blank" rel="noopener">LINKEDIN ' + arrow + '</a>'
        + '<div class="tagrow"><span class="chip">RESPONSE · &lt; 24H</span><span class="chip">TZ · ' + ME.tzLabel + '</span></div>' },
];

/* ---------- system state ---------- */
function options() {
  return {
    items: ITEMS,
    sel: 'profile',
    sound: 'STEREO',
    ring: { x: 0, y: 0, w: 0, h: 0, visible: false },
    toast: { on: false, msg: '' }, toastTimer: null,
    clock: '', dateStr: '', ac: null,

    get current() { return this.items.find(i => i.id === this.sel) || this.items[0]; },
    get ringStyle() {
      const r = this.ring;
      return 'transform:translate(' + r.x + 'px,' + r.y + 'px);width:' + r.w + 'px;height:' + r.h + 'px;opacity:' + (r.visible ? 1 : 0);
    },

    init() {
      this.tick();
      setInterval(() => this.tick(), 1000);
      this.$nextTick(() => this.ringBack());   // ring starts on the selected entry
      window.addEventListener('resize', () => { if (this.ring.visible) this.ringBack(); });
    },

    tick() {
      const d = new Date();
      this.clock = d.toLocaleTimeString('en-GB', { hour12: false });
      this.dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit' }).toUpperCase().replace(/,/g, '');
      let local = this.clock;
      try { local = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: ME.tz }).format(d); } catch (e) {}
      document.querySelectorAll('.liveclock').forEach(el => el.textContent = local);
    },

    rowValue(item) {
      if (item.id === 'sound')    return '\u25C2 ' + this.sound + ' \u25B8';
      if (item.id === 'location') return ME.tzLabel;
      return '';
    },

    /* selection — hovering previews, clicking commits */
    setSel(id) { if (this.sel !== id) this.sel = id; },
    activate(id) {
      this.setSel(id);
      if (id === 'sound') { this.cycleSound(); }
      else { this.blip(940, .06); }
    },
    move(d) {
      const i = this.items.findIndex(x => x.id === this.sel);
      const n = this.items[(i + d + this.items.length) % this.items.length];
      this.setSel(n.id);
      this.$nextTick(() => this.ringBack());
      this.blip(700, .045);
    },

    /* yellow ring snap */
    ringTo(el) {
      if (!el || !this.$refs.menu) return;
      const m = this.$refs.menu.getBoundingClientRect(), r = el.getBoundingClientRect();
      this.ring = { x: r.left - m.left, y: r.top - m.top, w: r.width, h: r.height, visible: true };
    },
    ringBack() {
      const el = this.$refs.menu && this.$refs.menu.querySelector('.row[data-id="' + this.sel + '"]');
      if (el) this.ringTo(el);
    },

    /* SOUND MODE — a real setting */
    cycleSound() {
      const modes = ['STEREO', 'MONO', 'OFF'];
      this.setSound(modes[(modes.indexOf(this.sound) + 1) % modes.length]);
    },
    setSound(m) {
      this.sound = m;
      if (m !== 'OFF') { this.blip(1040, .08); setTimeout(() => this.blip(784, .08), 110); }
      this.showToast('SOUND MODE · ' + m);
    },

    async copyEmail() {
      try { await navigator.clipboard.writeText(ME.email); }
      catch (e) {
        const ta = document.createElement('textarea');
        ta.value = ME.email; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (_) {}
        ta.remove();
      }
      this.blip(1180, .05);
      this.showToast('EMAIL COPIED TO CLIPBOARD');
    },

    showToast(msg) {
      this.toast = { on: true, msg };
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => this.toast.on = false, 2600);
    },

    /* menu blip — stereo/mono pan, synthesized on the fly */
    blip(freq = 880, dur = .07) {
      if (this.sound === 'OFF') return;
      try {
        this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = 'square'; o.frequency.value = freq;
        g.gain.setValueAtTime(.035, this.ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.0001, this.ac.currentTime + dur);
        let node = o.connect(g);
        if (this.ac.createStereoPanner) {
          const p = this.ac.createStereoPanner();
          p.pan.value = this.sound === 'STEREO' ? .4 : 0;   // MONO = centered
          node = node.connect(p);
        }
        node.connect(this.ac.destination);
        o.start(); o.stop(this.ac.currentTime + dur);
      } catch (e) {}
    }
  };
}
</script>
</body>
</html>
